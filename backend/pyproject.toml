[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-drive"
version = "0.1.0"
description = "Automated documentation drift detection for pull requests"
authors = [
    { name = "HisenBugs", email = "team@isenbugs.dev" }
]
readme = "../README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7.0",
    "gitpython>=3.1.43",
    "unidiff>=0.7.5",
    "tree-sitter>=0.21.3",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "ollama>=0.2.1",
    "typer[all]>=0.12.3",
    "rich>=13.7.1",
    "markdown-it-py>=3.0.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
]

[project.scripts]
docs-drift = "backend.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
